<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>C Beast Mode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column workbench. Header with rank trace, tab row, then the active view.
   Palette: solder-mask green board, copper accent, silkscreen-style condensed labels. */
:root{
  --bg:#EDF1EC; --surface:#F7F9F5; --raised:#FFFFFF; --ink:#12261E; --muted:#566B61; --line:#C9D5CC;
  --accent:#A5560F; --on-accent:#FFFFFF; --good:#1D7448; --bad:#B0352C;
  --code-bg:#0E2A21; --code-ink:#D6EADB; --c-kw:#E7A964; --c-str:#9ED3A8; --c-com:#78978A; --c-num:#92C5EC; --c-pre:#C9A6E8;
  --h0:#DCE5DE; --h1:#EBCDA8; --h2:#D18B45; --h3:#A5560F;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1612; --surface:#10221B; --raised:#152B23; --ink:#E3EEE7; --muted:#92A99E; --line:#26433A;
    --accent:#E48F42; --on-accent:#1B1006; --good:#4CC384; --bad:#F07A6E;
    --code-bg:#07120E; --code-ink:#D6EADB;
    --h0:#1B332B; --h1:#5A3A1B; --h2:#B4692A; --h3:#E48F42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1612; --surface:#10221B; --raised:#152B23; --ink:#E3EEE7; --muted:#92A99E; --line:#26433A;
  --accent:#E48F42; --on-accent:#1B1006; --good:#4CC384; --bad:#F07A6E;
  --code-bg:#07120E; --code-ink:#D6EADB;
  --h0:#1B332B; --h1:#5A3A1B; --h2:#B4692A; --h3:#E48F42;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.hdr{display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.07em;text-transform:uppercase}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;min-width:78px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip b{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.chip span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.on b{color:var(--accent)}

.trace{position:relative;display:grid;grid-template-columns:repeat(6,1fr);padding-top:2px}
.trace::before{content:"";position:absolute;top:11px;left:calc(100%/12);right:calc(100%/12);height:3px;background:var(--line);border-radius:2px}
.trace .fill{position:absolute;top:11px;left:calc(100%/12);width:calc((100% - 100%/6) * var(--p,0));height:3px;background:var(--accent);border-radius:2px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.node i{width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--line);display:block}
.node.reached i{border-color:var(--accent);background:var(--accent)}
.node.now i{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.node span{font-size:11px;line-height:1.2;color:var(--muted);letter-spacing:.02em}
.node.reached span{color:var(--ink);font-weight:600}
.next-up{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;
  font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

/* common */
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec-h{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;min-width:0}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:6px;
  border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.armed{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.pips i.on{background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.pill.alone{color:var(--good);border-color:var(--good)}
.pill.hint{color:var(--accent);border-color:var(--accent)}
.pill.peek{color:var(--bad);border-color:var(--bad)}

/* code */
pre.code,pre.io{margin:0;font-family:var(--font-mono);font-size:13px;line-height:1.55;border-radius:6px;padding:12px 14px;overflow-x:auto;
  background:var(--code-bg);color:var(--code-ink);tab-size:4}
pre.io{min-height:44px;white-space:pre}
.k{color:var(--c-kw)}.s{color:var(--c-str)}.c{color:var(--c-com);font-style:italic}.n{color:var(--c-num)}.p{color:var(--c-pre)}
textarea.editor{width:100%;min-height:260px;resize:vertical;font-family:var(--font-mono);font-size:13px;line-height:1.55;tab-size:4;
  background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;white-space:pre;overflow:auto}

/* mission */
.mission{display:grid;gap:10px}
.mc{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
.mc:hover{border-color:var(--muted)}
.pad{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.pad[data-s="alone"]{background:var(--good);border-color:var(--good)}
.pad[data-s="hint"]{background:var(--accent);border-color:var(--accent)}
.pad[data-s="peek"]{background:var(--bad);border-color:var(--bad)}
.pad svg{width:14px;height:14px}
.mc .slot{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mc .t{font-weight:600;font-size:16px}
.mc .m{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mc .xp{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--muted);text-align:right;line-height:1}
.mc .xp small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.06em}
.method{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.method li::marker{font-family:var(--font-mono);color:var(--accent);font-weight:500}

/* problems list */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{min-height:40px;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:6px 10px;min-width:0}
.filters input{flex:1 1 160px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.fc{appearance:none;min-height:36px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:13px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.pr:first-child{border-top:0}
.pr:hover{background:var(--raised)}
.pr .num{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.pr .t{font-weight:500}
.pr .m{font-size:12px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* problem detail */
.back{align-self:flex-start}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.prob h2{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
.io{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.io>div{min-width:0}
.timer{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.help .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.reveal{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.reveal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.cap{font-size:13px;color:var(--muted)}
.fin .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.result{border:1px solid var(--good);border-radius:8px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--muted)}

/* quiz */
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--raised);cursor:pointer;font-family:var(--font-mono);font-size:14px}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt[disabled]{cursor:default}
.why{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(12,1fr);grid-auto-flow:column;gap:4px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--h0);display:block}
.heat i[data-l="1"]{background:var(--h1)}.heat i[data-l="2"]{background:var(--h2)}.heat i[data-l="3"]{background:var(--h3)}
.heat i[data-l="x"]{background:transparent}
.lvrow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.lvrow .nm{font-size:13px}
.segs{display:flex;gap:3px;flex-wrap:wrap}
.segs i{width:14px;height:14px;border-radius:3px;background:var(--h0);display:block}
.segs i[data-s="alone"]{background:var(--good)}.segs i[data-s="hint"]{background:var(--accent)}.segs i[data-s="peek"]{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
textarea.bk{width:100%;min-height:90px;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--raised);resize:vertical}
@media (max-width:480px){
  .brand{font-size:32px}
  .lvrow{grid-template-columns:1fr}
  .mc{grid-template-columns:26px 1fr auto;gap:10px;padding:12px}
  .prob h2{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<div class="app">
<header class="hdr" id="hdr"></header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
<main id="view"></main>
</div>
<script>
const C = (s, ...v) => String.raw(s, ...v).replace(/^\n/, '');

const PROBLEMS = [
/* ---------- LEVEL 1 : WARM-UP ---------- */
{ id: 1, lvl: 1, cat: 'Basics', title: 'Even or odd',
  desc: 'Read one integer. Print Even if it divides by 2 with no remainder, otherwise print Odd.',
  in: '7', out: 'Odd',
  hints: ['What does n % 2 give for an even number? For an odd one?', 'In C, -3 % 2 is -1, not 1. Test for == 0 instead of == 1.'],
  steps: ['Read n with scanf.', 'Compute the remainder n % 2.', 'Remainder 0 means Even. Anything else means Odd.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n;
    scanf("%d", &n);
    if (n % 2 == 0)
        printf("Even\n");
    else
        printf("Odd\n");
    return 0;
}
` },

{ id: 2, lvl: 1, cat: 'Loops', title: 'FizzBuzz',
  desc: 'Read N. For every number from 1 to N print Fizz if it divides by 3, Buzz if it divides by 5, FizzBuzz if it divides by both, otherwise the number itself. One per line.',
  in: '15', out: '1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz',
  hints: ['Which check must come first, and why?', 'A number divisible by 3 and 5 is divisible by 15.'],
  steps: ['Loop i from 1 to N.', 'If i % 15 == 0 print FizzBuzz.', 'Else if i % 3 == 0 print Fizz, else if i % 5 == 0 print Buzz.', 'Otherwise print i.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n;
    scanf("%d", &n);
    for (int i = 1; i <= n; i++) {
        if (i % 15 == 0)
            printf("FizzBuzz\n");
        else if (i % 3 == 0)
            printf("Fizz\n");
        else if (i % 5 == 0)
            printf("Buzz\n");
        else
            printf("%d\n", i);
    }
    return 0;
}
` },

{ id: 3, lvl: 1, cat: 'Basics', title: 'Largest of three',
  desc: 'Read three integers and print the largest one.',
  in: '14 92 37', out: '92',
  hints: ['Keep a variable called max. Start it as the first number.', 'Compare the other two against max, one at a time.'],
  steps: ['Set max = a.', 'If b > max, set max = b.', 'If c > max, set max = c.', 'Print max.'],
  code: C`
#include <stdio.h>

int main(void) {
    int a, b, c;
    scanf("%d %d %d", &a, &b, &c);
    int max = a;
    if (b > max) max = b;
    if (c > max) max = c;
    printf("%d\n", max);
    return 0;
}
` },

{ id: 4, lvl: 1, cat: 'Basics', title: 'Swap without a third variable',
  desc: 'Read two integers a and b. Swap their values without using a temporary variable, then print them.',
  in: '3 9', out: '9 3',
  hints: ['Store the sum in one of the variables first.', 'After a = a + b, you can recover each original by subtraction.'],
  steps: ['a = a + b (a now holds both).', 'b = a - b (b becomes the old a).', 'a = a - b (a becomes the old b).', 'Print a and b. Note: a + b can overflow for huge values.'],
  code: C`
#include <stdio.h>

int main(void) {
    int a, b;
    scanf("%d %d", &a, &b);
    a = a + b;
    b = a - b;
    a = a - b;
    printf("%d %d\n", a, b);
    return 0;
}
` },

{ id: 5, lvl: 1, cat: 'Numbers', title: 'Sum of digits',
  desc: 'Read a positive integer and print the sum of its digits.',
  in: '4821', out: '15',
  hints: ['n % 10 gives the last digit.', 'n / 10 removes the last digit. Repeat until n is 0.'],
  steps: ['Set sum = 0.', 'While n > 0: add n % 10 to sum.', 'Then do n = n / 10.', 'Print sum.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n, sum = 0;
    scanf("%d", &n);
    if (n < 0) n = -n;
    while (n > 0) {
        sum += n % 10;
        n /= 10;
    }
    printf("%d\n", sum);
    return 0;
}
` },

{ id: 6, lvl: 1, cat: 'Patterns', title: 'Star triangle',
  desc: 'Read N and print a right-angled triangle of stars with N rows. Row i has i stars.',
  in: '4', out: '*\n**\n***\n****',
  hints: ['You need two loops. One for rows, one inside it for stars.', 'The inner loop runs as many times as the current row number.'],
  steps: ['Outer loop i = 1 to N is the row.', 'Inner loop j = 1 to i prints one star each time.', 'After the inner loop, print a newline.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n;
    scanf("%d", &n);
    for (int i = 1; i <= n; i++) {
        for (int j = 1; j <= i; j++)
            printf("*");
        printf("\n");
    }
    return 0;
}
` },

{ id: 7, lvl: 1, cat: 'Numbers', title: 'Factorial',
  desc: 'Read N (0 to 20) and print N factorial.',
  in: '10', out: '3628800',
  hints: ['Multiply 1 x 2 x 3 x ... x N in a loop.', '21! no longer fits in 64 bits. Use unsigned long long and print with %llu.'],
  steps: ['Set f = 1.', 'Loop i from 2 to N and do f = f * i.', 'For N = 0 or 1 the loop never runs and f stays 1, which is correct.', 'Print f.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n;
    unsigned long long f = 1;
    scanf("%d", &n);
    for (int i = 2; i <= n; i++)
        f *= i;
    printf("%llu\n", f);
    return 0;
}
` },

{ id: 8, lvl: 1, cat: 'Numbers', title: 'Fibonacci series',
  desc: 'Read N and print the first N Fibonacci numbers starting from 0, separated by single spaces.',
  in: '8', out: '0 1 1 2 3 5 8 13',
  hints: ['Keep two variables: the current term and the next one.', 'Each step: new = a + b, then slide a and b forward.'],
  steps: ['Set a = 0, b = 1.', 'Print a.', 'Compute next = a + b, then a = b, b = next.', 'Repeat N times. Print a space between terms but not after the last.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n;
    scanf("%d", &n);
    long long a = 0, b = 1;
    for (int i = 0; i < n; i++) {
        printf("%lld", a);
        if (i < n - 1) printf(" ");
        long long next = a + b;
        a = b;
        b = next;
    }
    printf("\n");
    return 0;
}
` },

/* ---------- LEVEL 2 : CORE ---------- */
{ id: 9, lvl: 2, cat: 'Numbers', title: 'Reverse a number',
  desc: 'Read a positive integer and print it with the digits reversed. Leading zeros of the result are dropped.',
  in: '12340', out: '4321',
  hints: ['Peel digits off the end with % 10.', 'Build the answer with rev = rev * 10 + digit.'],
  steps: ['Set rev = 0.', 'While n > 0: digit = n % 10.', 'rev = rev * 10 + digit, then n = n / 10.', 'Trace 12340: rev goes 0, 4, 43, 432, 4321.'],
  code: C`
#include <stdio.h>

int main(void) {
    int n, rev = 0;
    scanf("%d", &n);
    while (n > 0) {
        rev = rev * 10 + n % 10;
        n /= 10;
    }
    printf("%d\n", rev);
    return 0;
}

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const byId = id => PROBLEMS.find(p => p.id === id);
const fmtMs = ms => { const s = Math.floor(ms / 1000); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); };

const LV = [null,
  { name: 'Warm-up', xp: 10 }, { name: 'Core', xp: 20 }, { name: 'Hard', xp: 35 }, { name: 'Beast', xp: 60 }];
const MULT = { alone: 1, hint: 0.6, peek: 0.25 };
const MODE_ORDER = { peek: 1, hint: 2, alone: 3 };
const MODE_TXT = { alone: 'On my own', hint: 'With hints', peek: 'Studied the solution' };
const xpFor = (lvl, mode) => Math.round(LV[lvl].xp * MULT[mode]);
const RANKS = [
  { n: 'Rookie', xp: 0 }, { n: 'Coder', xp: 150 }, { n: 'Debugger', xp: 400 },
  { n: 'Firmware Dev', xp: 800 }, { n: 'Pointer Slayer', xp: 1500 }, { n: 'Beast', xp: 3000 }
];
const CATS = Array.from(new Set(PROBLEMS.map(p => p.cat))).sort();
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';

/* ---------- C syntax colouring ---------- */
const HL_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[ \t]*\w+[^\n]*)|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b|\b(int|char|float|double|void|long|short|unsigned|signed|struct|typedef|const|static|return|if|else|for|while|do|switch|case|break|continue|default|sizeof|enum|union|NULL)\b/gm;
function hl(code) {
  let out = '', last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'p' : m[4] ? 'n' : 'k';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = HL_RE.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---------- state ---------- */
const LS = 'cbeast.v1';
const blank = () => ({ v: 1, xp: 0, updatedAt: 0, days: {}, probs: {}, quiz: {}, rounds: 0 });
function normalize(o) {
  const b = blank();
  if (!o || typeof o !== 'object') return b;
  b.xp = +o.xp || 0; b.updatedAt = +o.updatedAt || 0; b.rounds = +o.rounds || 0;
  if (o.days && typeof o.days === 'object') b.days = o.days;
  if (o.probs && typeof o.probs === 'object') b.probs = o.probs;
  if (o.quiz && typeof o.quiz === 'object') b.quiz = o.quiz;
  return b;
}
function loadLocal() { try { return normalize(JSON.parse(localStorage.getItem(LS))); } catch (e) { return blank(); } }
let S = loadLocal();
const ui = { tab: 'today', pid: null, rev: {}, t0: 0, timer: null, round: null, f: { lv: 0, cat: 'all', st: 'all', q: '' }, sync: 'local', result: null };

/* ---------- sync (db) ---------- */
let dbh = null, uid = null, pushTimer = null, pushing = false, pushAgain = false;
const progPath = () => 'data/users/' + uid + '/progress';
function setSync(s) { ui.sync = s; const el = $('#syncline'); if (el) el.textContent = syncText(); }
function syncText() {
  return ui.sync === 'ok' ? 'Progress is saved to your account and follows you across devices.'
    : ui.sync === 'wait' ? 'Saving to your account...'
    : ui.sync === 'err' ? 'Could not reach your account. Progress is still saved on this device.'
    : 'Progress is saved on this device only. Use the backup box below to move it.';
}
function pruneDays() {
  const keys = Object.keys(S.days).sort();
  keys.slice(0, Math.max(0, keys.length - 60)).forEach(k => { delete S.days[k].mission; delete S.days[k].solved; });
}
function save() {
  S.updatedAt = Date.now();
  pruneDays();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* storage blocked */ }
  if (dbh && uid) { setSync('wait'); clearTimeout(pushTimer); pushTimer = setTimeout(push, 1200); }
}
async function push() {
  if (!dbh || !uid) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await dbh.doc(progPath()).set(JSON.parse(JSON.stringify(S))); setSync('ok'); }
  catch (e) { setSync('err'); }
  pushing = false;
  if (pushAgain) { pushAgain = false; push(); }
}
async function initRemote() {
  try {
    if (!window.claude || !claude.use) return;
    const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    dbh = d; uid = id;
    const snap = await dbh.doc(progPath()).get();
    if (snap.exists) {
      const r = normalize(snap.data());
      if (r.updatedAt > S.updatedAt) {
        S = r;
        try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* ignore */ }
        if (!ui.pid) render();
        renderHeader();
        setSync('ok');
      } else if (S.updatedAt > r.updatedAt) { setSync('wait'); push(); }
      else setSync('ok');
    } else if (S.updatedAt) { setSync('wait'); push(); }
    else setSync('ok');
  } catch (e) { dbh = null; setSync('local'); }
}

/* code notes: local first, db in the background */
let codeTimer = null, codePending = {};
const codeKey = id => 'cbeast.code.' + id;
function starterFor(p) {
  return '/* ' + p.title + ' */\n#include <stdio.h>\n\nint main(void) {\n    // write your solution here\n\n    return 0;\n}\n';
}
function readLocalCode(id) { try { return localStorage.getItem(codeKey(id)); } catch (e) { return null; } }
function writeCode(id, text) {
  try { localStorage.setItem(codeKey(id), text); localStorage.setItem(codeKey(id) + '.u', String(Date.now())); } catch (e) { /* ignore */ }
  codePending[id] = text;
  if (dbh && uid) { clearTimeout(codeTimer); codeTimer = setTimeout(flushCode, 1500); }
}
async function flushCode() {
  const items = Object.entries(codePending); codePending = {};
  for (const [id, t] of items) {
    try { await dbh.doc('data/users/' + uid + '/code-' + id).set({ t: t.slice(0, 20000), u: Date.now() }); } catch (e) { /* retry on next edit */ }
  }
}
async function remoteCode(id) {
  if (!dbh || !uid) return null;
  try { const s = await dbh.doc('data/users/' + uid + '/code-' + id).get(); return s.exists ? s.data() : null; } catch (e) { return null; }
}

/* ---------- derived ---------- */
function dayRec(k) { k = k || todayKey(); if (!S.days[k]) S.days[k] = { a: 0, xp: 0 }; return S.days[k]; }
function award(n, count) {
  const d = dayRec();
  S.xp += n; d.xp = (d.xp || 0) + n;
  if (count !== false) d.a = (d.a || 0) + 1;
}
function streakInfo() {
  const keys = Object.keys(S.days).filter(k => S.days[k].a > 0).sort();
  const set = new Set(keys);
  let cur = 0; const d = new Date();
  if (!set.has(keyOf(d))) d.setDate(d.getDate() - 1);
  while (set.has(keyOf(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const dt = new Date(k + 'T00:00:00');
    run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = dt;
  });
  return { cur, best, today: set.has(todayKey()) };
}
function rankInfo(xp) {
  let i = 0;
  RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; });
  const next = RANKS[i + 1];
  const frac = next ? (xp - RANKS[i].xp) / (next.xp - RANKS[i].xp) : 1;
  return { i, next, frac, rank: RANKS[i] };
}
const best = id => (S.probs[id] && S.probs[id].best) || null;
const aloneCount = () => PROBLEMS.filter(p => best(p.id) === 'alone').length;
const tier = () => Math.min(4, 1 + Math.floor(aloneCount() / 8));

/* ---------- daily mission ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function ensureMission() {
  const d = dayRec();
  if (d.mission && d.mission.length) return d.mission;
  const rng = mulberry(hashStr(todayKey()));
  const t = tier(), used = new Set(), out = [];
  const pick = pool => { pool = pool.filter(p => !used.has(p.id)); if (!pool.length) return null; return pool[Math.floor(rng() * pool.length)]; };
  const take = (slot, pools) => {
    for (const pool of pools) { const p = pick(pool); if (p) { used.add(p.id); out.push({ id: p.id, slot }); return; } }
  };
  const notAlone = p => best(p.id) !== 'alone';
  const review = PROBLEMS.filter(p => (best(p.id) === 'peek' || best(p.id) === 'hint') && p.lvl <= t);
  take(review.length ? 'Review' : 'Warm-up', [
    review,
    PROBLEMS.filter(p => notAlone(p) && p.lvl <= Math.max(1, t - 1)),
    PROBLEMS.filter(p => p.lvl <= t)
  ]);
  take('Core', [PROBLEMS.filter(p => notAlone(p) && p.lvl === t), PROBLEMS.filter(p => notAlone(p) && p.lvl <= t), PROBLEMS.filter(p => p.lvl === t)]);
  take('Stretch', [PROBLEMS.filter(p => notAlone(p) && p.lvl === Math.min(4, t + 1)), PROBLEMS.filter(notAlone), PROBLEMS]);
  d.mission = out;
  save();
  return out;
}

/* predict */
function pickRound() {
  const scored = QUIZ.map(q => {
    const r = S.quiz[q.id];
    const sc = !r ? 2 : (r.l === 0 ? 3 : 1);
    return { id: q.id, s: sc + Math.random() };
  }).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.id);
  return scored.sort(() => Math.random() - 0.5);
}
function viewPredict() {

    return '<div class="view"><div><h2 class="sec-h">Predict the output</h2><p class="sub">Read the code. Decide what it prints before you tap. Wrong answers come back more often until you get them right.</p></div>' +
      '<div class="card row" style="justify-content:space-between"><div><b>' + seen + ' of ' + QUIZ.length + '</b> questions seen<br><span class="sub">' + right + ' answered correctly last time</span></div>' +

  }).join('');

}
async function setupEditor() {
  const p = byId(ui.pid), ta = $('#code');
  if (!ta) return;
  const local = readLocalCode(p.id);
  ta.value = local !== null ? local : starterFor(p);
  let touched = false, trap = true;
  ta.addEventListener('input', () => { touched = true; writeCode(p.id, ta.value); });
  ta.addEventListener('focus', () => { trap = true; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { trap = false; return; }
    if (e.key === 'Tab' && !e.shiftKey && trap) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      touched = true; writeCode(p.id, ta.value);
    }
  });
  const rc = await remoteCode(p.id);
  if (rc && typeof rc.t === 'string' && !touched && ui.pid === p.id && rc.t !== ta.value) {
    let lu = 0; try { lu = +localStorage.getItem(codeKey(p.id) + '.u') || 0; } catch (e) { /* ignore */ }
    if (local === null || (rc.u || 0) > lu) { ta.value = rc.t; try { localStorage.setItem(codeKey(p.id), rc.t); } catch (e) { /* ignore */ } }
  }
}
function finish(claimed) {
  const p = byId(ui.pid), r = ui.rev;
  const forced = r.steps || r.sol ? 'peek' : (r.h1 || r.h2 ? 'hint' : 'alone');
  let mode = claimed;
  if (MODE_ORDER[forced] < MODE_ORDER[mode]) mode = forced;
  const rec = S.probs[p.id] || (S.probs[p.id] = { best: null, n: 0, xp: 0 });
  rec.n++; rec.last = todayKey();
  const newXp = xpFor(p.lvl, mode);
  let gain = 0;
  if (!rec.best || MODE_ORDER[mode] > MODE_ORDER[rec.best]) { gain = newXp - (rec.xp || 0); rec.best = mode; rec.xp = newXp; }
  const ms = Date.now() - ui.t0;
  if (mode === 'alone' && (!rec.ms || ms < rec.ms)) rec.ms = ms;
  award(gain, true);
  let bonus = 0;
  const d = dayRec();
  if (d.mission && d.mission.some(x => x.id === p.id)) {
    d.solved = d.solved || [];
    if (d.solved.indexOf(p.id) < 0) d.solved.push(p.id);
    if (!d.bonus && d.mission.every(x => d.solved.indexOf(x.id) >= 0)) { d.bonus = 1; bonus = 25; award(25, false); }
  }
  save(); renderHeader(); stopTimer();
  const downgraded = mode !== claimed;
  let h = '<div class="result"><b>' + MODE_TXT[mode] + '. ' + (gain + bonus > 0 ? '+' + (gain + bonus) + ' XP' : 'No new XP') + '.</b>';
  if (downgraded) h += '<p class="sub">You opened ' + (forced === 'peek' ? 'the logic steps or the solution' : 'a hint') + ', so this counts as "' + MODE_TXT[mode].toLowerCase() + '".</p>';
  if (bonus) h += '<p>Mission bonus earned: +25 XP. All three done today.</p>';
  if (gain === 0 && !bonus) h += '<p class="sub">You already have a result this good. Repeat reps still keep your streak alive.</p>';
  if (mode === 'peek') h += '<p class="sub">This one is in your review queue. Redo it from a blank page tomorrow.</p>';
  if (mode === 'alone' && rec.ms) h += '<p class="sub">Your best time on your own: ' + fmtMs(rec.ms) + '.</p>';
  h += '<div class="row"><button class="btn primary" data-act="back">Back to missions</button></div></div>';
  $('#result').innerHTML = h;
  $('#result').scrollIntoView({ block: 'nearest' });
}

/* ---------- clipboard ---------- */
async function copyText(text, btn) {
  const orig = btn.textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try {
      const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove();
    } catch (e2) { ok = false; }
  }
  btn.textContent = ok ? 'Copied' : 'Select and copy manually';
  setTimeout(() => { btn.textContent = orig; }, 1600);
  return ok;
}
function arm(btn, armedText, fn) {
  if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.orig; fn(); return; }
  btn.dataset.orig = btn.textContent; btn.textContent = armedText; btn.classList.add('armed');
  btn.dataset.armed = String(setTimeout(() => { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.orig; }, 3500));
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') return setTab(el.dataset.t);
  if (act === 'open') return openProblem(+el.dataset.id);
  if (act === 'back') { ui.pid = null; stopTimer(); render(); window.scrollTo(0, 0); return; }
  if (act === 'flv') { ui.f.lv = +el.dataset.l; render(); return; }
  if (act === 'copycode') return copyText($('#code').value, el);
  if (act === 'copyin') return copyText(byId(ui.pid).in, el);
  if (act === 'copysol') return copyText(byId(ui.pid).code, el);
  if (act === 'resetcode') {
    return arm(el, 'Tap again to erase your code', () => {
      const p = byId(ui.pid); $('#code').value = starterFor(p); writeCode(p.id, $('#code').value);
    });
  }
  if (act === 'reveal') {
    const k = el.dataset.k;
    const doReveal = () => {
      if (!ui.rev[k]) {
        ui.rev[k] = true;
        $('#rv').insertAdjacentHTML('beforeend', revealHtml(k));
      }
      el.disabled = true;
      $('#cap').textContent = capText();
      const node = $('#rv-' + k); if (node) node.scrollIntoView({ block: 'nearest' });
    };
    if (k === 'steps' || k === 'sol') return arm(el, 'Tap again. XP drops to 25%', doReveal);
    return doReveal();
  }
  if (act === 'done') return finish(el.dataset.m);
  if (act === 'round') { ui.round = { ids: pickRound(), i: 0, picked: null, score: 0, xp: 0, done: false }; ui.tab = 'predict'; ui.pid = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'endround') { ui.round = null; render(); return; }
  if (act === 'pick') {
    const R = ui.round; if (!R || R.picked !== null) return;
    const q = QUIZ.find(x => x.id === R.ids[R.i]), i = +el.dataset.i, ok = i === q.ans;
    R.picked = i;
    const rec = S.quiz[q.id] || (S.quiz[q.id] = { r: 0, w: 0, l: 0, got: 0 });
    let gain = 0;
    if (ok) { rec.r++; rec.l = 1; R.score++; gain = rec.got ? 1 : 5; rec.got = 1; } else { rec.w++; rec.l = 0; }
    R.xp += gain; award(gain, true); save(); renderHeader(); render();
    return;
  }
  if (act === 'next') {
    const R = ui.round; R.i++; R.picked = null;
    if (R.i >= R.ids.length) { R.done = true; S.rounds++; save(); }
    render(); window.scrollTo(0, 0); return;
  }
  if (act === 'exportp') return copyText(JSON.stringify(S), el);
  if (act === 'restore') {
    return arm(el, 'Tap again to replace current progress', () => {
      const msg = $('#bkmsg');
      try {
        const o = JSON.parse($('#bk').value);
        if (!o || typeof o !== 'object' || !o.days || !o.probs) throw new Error('shape');
        S = normalize(o); S.updatedAt = Date.now(); save(); renderHeader(); render();
      } catch (err) { if (msg) msg.textContent = 'That text is not a valid backup.'; }
    });
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fcat') { ui.f.cat = e.target.value; render(); }
  if (e.target.id === 'fst') { ui.f.st = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fq') {
    ui.f.q = e.target.value;
    const keepPos = e.target.selectionStart;
    render();
    const q = $('#fq'); if (q) { q.focus(); q.setSelectionRange(keepPos, keepPos); }
  }
});

/* ---------- boot ---------- */
function boot() {
  const h = (location.hash || '').replace('#', '');
  if (VIEWS[h]) ui.tab = h;
  renderHeader();
  render();
  initRemote();
}
boot();
})();

</script>
